<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f0ebe3" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ae774e" />
      <stop offset="100%" stop-color="#856d52" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect x="25" y="25" width="1150" height="750" rx="12" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 6" />
  
  <!-- Architectural grid lines -->
  <g stroke="#ae774e" stroke-width="1" stroke-opacity="0.12">
    <line x1="200" y1="50" x2="200" y2="750" />
    <line x1="400" y1="50" x2="400" y2="750" />
    <line x1="600" y1="50" x2="600" y2="750" />
    <line x1="800" y1="50" x2="800" y2="750" />
    <line x1="1000" y1="50" x2="1000" y2="750" />
    <line x1="50" y1="200" x2="1150" y2="200" />
    <line x1="50" y1="400" x2="1150" y2="400" />
    <line x1="50" y1="600" x2="1150" y2="600" />
  </g>

  <g transform="translate(600, 360)">
    <circle cx="0" cy="0" r="48" fill="#ffffff" stroke="url(#accent)" stroke-width="2" />
    <!-- Blueprint / floorplan icon -->
    <path d="M-18,-18 L18,-18 L18,18 L-18,18 Z" fill="none" stroke="#ae774e" stroke-width="2" />
    <path d="M-18,-4 L6,-4 L6,18" fill="none" stroke="#ae774e" stroke-width="1.8" />
    <path d="M-6,-18 L-6,-4" fill="none" stroke="#ae774e" stroke-width="1.8" />
  </g>

  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#2c241e" text-anchor="middle" letter-spacing="1">
    PLAN / LAYOUT PLACEHOLDER
  </text>
  <text x="600" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#756456" text-anchor="middle">
    Replace with official architectural floor plan or master plan graphic
  </text>
</svg>
